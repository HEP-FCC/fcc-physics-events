apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: dami-backend
  name: dami-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: dami-backend
  template:
    metadata:
      annotations:
        eos.okd.cern.ch/mount-eos-with-credentials-from-secret: eos-credentials
      labels:
        io.kompose.service: dami-backend
    spec:
      containers:
      - image: registry.cern.ch/fcc-physics-events/fcc-physics-events-backend:latest
        name: dami-backend
        ports:
        - containerPort: 8000
          protocol: TCP
        envFrom:
        - secretRef:
            name: dami-backend
        # Allow up to 5 minutes for the startup (database setup, file watcher)
        startupProbe:
          httpGet:
            path: /healthz
            port: 8000
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        volumeMounts:
        - name: eos
          mountPath: /eos
        - name: backend-storage
          mountPath: /backend-storage
      volumes:
      - name: eos
        persistentVolumeClaim:
          claimName: eos-volume
      - name: backend-storage
        persistentVolumeClaim:
          claimName: dami-backend-storage-pvc
      restartPolicy: Always
